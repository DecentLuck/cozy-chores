<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cozy Chores</title>
<meta name="theme-color" content="#241a14">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cozy Chores">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  color-scheme: dark;
  --bg:#241a14; --card:#33251c; --ink:#f5e6d0; --muted:#bfa58a; --line:#47352a;
  --accent:#e8913a; --accent-ink:#2a1a10; --soft:#3f2e23;
  --r1:#e8913a; --r2:#e6c063; --r3:#c95f44;
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
body[data-season="winter"]{ --bg:#1b2129; --card:#262e38; --ink:#eef1f5; --muted:#a5b0bf; --line:#36404d; --accent:#e0a45c; --accent-ink:#1f1610; --soft:#2f3844; --r1:#e0a45c; --r2:#d06a5f; --r3:#8fb3d9; }
body[data-season="spring"]{ --bg:#1f241d; --card:#2b3228; --ink:#f1f0e4; --muted:#b1b7a1; --line:#3b4436; --accent:#e79ab0; --accent-ink:#2a1a20; --soft:#343c30; --r1:#e79ab0; --r2:#a6cf86; --r3:#b8a6e3; }
body[data-season="summer"]{ --bg:#1d1f2b; --card:#292c3b; --ink:#f7efe0; --muted:#b8b0a3; --line:#3a3d50; --accent:#f0aa4c; --accent-ink:#2a1a0c; --soft:#333647; --r1:#f0aa4c; --r2:#5fc0c0; --r3:#ee7c66; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg); background-image:radial-gradient(120% 50% at 50% 0%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%); background-attachment:fixed; color:var(--ink); font-family:var(--round);
  font-size:16px; line-height:1.4; transition:background .6s;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:12px 16px 120px}

/* header */
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:8px 2px 14px}
.hello{font-family:var(--serif);font-size:26px;font-weight:600;margin:2px 0 0;letter-spacing:-.01em}
.season-line{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.icon-btn{border:0;background:var(--card);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.3);cursor:pointer;flex:none}
.icon-btn svg{width:20px;height:20px}

/* view toggle */
.toggle{display:flex;background:var(--soft);border-radius:999px;padding:4px;margin-bottom:12px}
.toggle button{flex:1;border:0;background:transparent;padding:8px 0;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;transition:background .25s,color .25s}
.toggle button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.35)}

.card{background:var(--card);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 30px rgba(0,0,0,.35);overflow:hidden}
.hero{margin-bottom:22px}
#scene svg{display:block;width:100%;height:auto}
.hero-foot{padding:12px 16px 14px}
.hero-foot .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.hero-foot .pts{font-weight:700}
.hero-foot .next{color:var(--muted);font-size:13px;margin-top:6px}
.bar{height:8px;background:var(--soft);border-radius:99px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* stats */
#stats{padding:16px}
.rings{display:flex;align-items:center;gap:16px}
.rings svg{width:150px;height:150px;flex:none}
.ring-bg{opacity:.17}
.ring-fg{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.legend{display:grid;gap:10px;flex:1;min-width:0}
.legend div{display:flex;align-items:center;gap:8px;font-size:14px}
.legend .dot{width:10px;height:10px;border-radius:50%;flex:none}
.legend b{font-size:20px;font-variant-numeric:tabular-nums;margin-left:auto}
.legend small{color:var(--muted);display:block;font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.tile{background:var(--soft);border-radius:14px;padding:10px}
.tile b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.tile span{font-size:11.5px;color:var(--muted);line-height:1.2;display:block}
.hist{margin-top:16px}
.hist h3{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 8px}
.hist .bars{display:flex;align-items:flex-end;gap:4px;height:64px}
.hist .bars div{flex:1;background:var(--soft);border-radius:5px;position:relative;height:100%;overflow:hidden}
.hist .bars div i{position:absolute;left:0;right:0;bottom:0;background:var(--r1);border-radius:5px}
.hist .bars div.today{outline:2px solid var(--r1);outline-offset:1px}
.hist .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}

/* chore lists */
.group{margin-bottom:22px}
.ghead{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 8px}
.ghead h2{font-family:var(--serif);font-size:20px;margin:0;font-weight:600}
.chip{font-size:12.5px;font-weight:700;color:var(--muted);background:var(--soft);padding:3px 10px;border-radius:99px;font-variant-numeric:tabular-nums}
.chip.full{background:var(--accent);color:var(--accent-ink)}
ul.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:10px 6px 10px 14px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .2s}
.row + .row{border-top:1px solid var(--line)}
.row:active{background:var(--soft)}
.check{color:var(--accent-ink);width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line);flex:none;display:grid;place-items:center;transition:background .25s,border-color .25s,transform .25s;background:transparent;padding:0;cursor:pointer}
.check svg{width:16px;height:16px;opacity:0;transform:scale(.5);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.row.done .check{background:var(--accent);border-color:var(--accent)}
.row.done .check svg{opacity:1;transform:none}
.row.partial .check{border-color:var(--accent);border-style:dashed}
.row.done .name{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.info{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name .em{margin-right:6px}
.sub{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.pips{display:inline-flex;gap:3px}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--accent)}
.chev{width:18px;height:18px;color:var(--muted);flex:none;transition:transform .25s}
.row.open .chev{transform:rotate(180deg)}
.subs{padding:0 12px 10px 54px;display:grid;gap:2px}
.subs + .row{border-top:1px solid var(--line)}
.sub-item{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:7px 6px;text-align:left;font-size:14.5px;cursor:pointer;border-radius:10px;width:100%}
.sub-item:active{background:var(--soft)}
.mini{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--accent-ink);transition:background .2s,border-color .2s}
.mini svg{width:12px;height:12px;opacity:0;transition:opacity .2s}
.sub-item.on .mini{background:var(--accent);border-color:var(--accent)}
.sub-item.on .mini svg{opacity:1}
.sub-item.on .sname{color:var(--muted);text-decoration:line-through}
.subbar{display:inline-block;width:34px;height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.subbar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.sub-edit{display:flex;gap:8px;margin-bottom:8px}
.sub-edit input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
.sub-edit input:focus{border-color:var(--accent)}
.sub-edit button{width:42px;flex:none;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;color:var(--muted);cursor:pointer}
.btn.ghost{background:transparent;border:1.5px dashed var(--line);padding:10px;font-size:14.5px;width:100%;flex:none;color:var(--muted)}
.more{border:0;background:transparent;width:38px;height:38px;border-radius:50%;color:var(--muted);cursor:pointer;flex:none;display:grid;place-items:center}
.more:active{background:var(--soft)}
.more svg{width:20px;height:20px}
.age-fresh{color:var(--r2)}
.empty{text-align:center;padding:30px 20px;color:var(--muted)}

.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 24px color-mix(in srgb, var(--accent) 35%, transparent);cursor:pointer;display:grid;place-items:center;z-index:5}
.fab svg{width:26px;height:26px}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .2s}
.sheet{position:relative;background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-family:var(--serif);margin:0 0 14px;font-size:22px}
.field{margin-bottom:16px}
.field > label,.field > .lbl{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input[type=text],.field input[type=date]{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
.field input:focus{border-color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--bg);padding:8px 14px;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.emojis button{border:1.5px solid var(--line);background:var(--bg);height:42px;border-radius:12px;font-size:20px;cursor:pointer;padding:0}
.emojis button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);font-size:20px;cursor:pointer}
.stepper output{font-size:20px;font-weight:700;min-width:22px;text-align:center}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.actions{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;border:0;border-radius:16px;padding:14px;font-weight:700;font-size:16px;cursor:pointer;background:var(--soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:#ec8a7a;flex:none;padding:14px 10px}
.set-row{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.set-row .btn{flex:none;text-align:left}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--card);padding:11px 14px 11px 18px;border-radius:16px;display:flex;align-items:center;gap:14px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:transparent;color:inherit;font-weight:800;text-decoration:underline;cursor:pointer;padding:4px}

@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}

/* scene animation */
.item{opacity:0;transform:scale(.5);transform-box:fill-box;transform-origin:50% 100%;transition:opacity .5s,transform .5s cubic-bezier(.3,1.5,.5,1)}
.item.on{opacity:1;transform:none}
.item.pop{animation:pop .9s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.p{animation:drift var(--d) linear infinite;animation-delay:var(--dl);transform-box:fill-box;transform-origin:center}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(14px,140px) rotate(200deg)}100%{transform:translate(-6px,290px) rotate(380deg)}}
.ff{animation:wander var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes wander{0%,100%{transform:translate(0,0);opacity:.15}25%{transform:translate(10px,-8px);opacity:1}50%{transform:translate(18px,4px);opacity:.35}75%{transform:translate(6px,10px);opacity:1}}
.shimmer{animation:shimmer 5s ease-in-out infinite}
@keyframes shimmer{0%,100%{transform:translateX(0);opacity:.08}50%{transform:translateX(6px);opacity:.45}}
.p.up{animation-name:rise}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(14px,-105px);opacity:0}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.1) rotate(2deg)}}
.steam{animation:steam 3s ease-in-out infinite;opacity:0}
@keyframes steam{0%{opacity:0;transform:translateY(3px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-6px)}}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.025,1.06)}}
.twinkle{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.35}}
.zz{animation:zz 4s ease-in-out infinite;opacity:0}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:.8}100%{opacity:0;transform:translate(6px,-14px)}}
#glow{transition:opacity 1s}
@media (prefers-reduced-motion: reduce){
  .p,.ff,.shimmer,.flame,.steam,.breathe,.twinkle,.zz,.item.pop{animation:none}
  .steam,.zz{opacity:.5}
}
</style>
</head>
<body data-season="fall">
<div class="wrap">
  <header>
    <div>
      <div class="season-line" id="seasonLine"></div>
      <h1 class="hello" id="hello">Hello</h1>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
    </button>
  </header>

  <div class="toggle" role="group" aria-label="View">
    <button id="vCozy" aria-pressed="true">Cozy</button>
    <button id="vStats" aria-pressed="false">Stats</button>
  </div>

  <section class="card hero">
    <div id="cozyView">
      <div id="scene"></div>
      <div class="hero-foot">
        <div class="row1"><span id="todayLine"></span><span class="pts" id="ptsLine"></span></div>
        <div class="bar"><i id="nextBar"></i></div>
        <div class="next" id="nextLine"></div>
      </div>
    </div>
    <div id="stats" hidden></div>
  </section>

  <main id="lists"></main>
</div>

<button class="fab" id="addBtn" aria-label="Add a chore">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
</div>

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo" hidden>Undo</button></div>

<script>
'use strict';
const KEY = 'cozychores.v1';
const DAY = 864e5;
const PTS = {daily:5, weekly:15, monthly:30, loose:20};
const FREQS = ['daily','weekly','monthly','loose'];
const FREQ_LABEL = {daily:'Daily', weekly:'Weekly', monthly:'Monthly', loose:'Now & then'};
const GROUP_TITLE = {daily:'Today', weekly:'This week', monthly:'This month', loose:'Now & then'};
const PERIOD_WORD = {daily:'today', weekly:'this week', monthly:'this month'};
const THRESH = [10, 40, 90, 160, 250, 360, 500, 660, 850, 1100];
const SLOTS = ['pumpkins','mugs','rug','logs','mantel','blanket','lanterns','cat','flowers','lights'];
const EMOJIS = ['🛏️','🍽️','🧺','🧹','🧽','🗑️','🪴','🐾','🚿','🧼','🛒','🍳','🪟','🌿','📦','✨','🧊','🌸','🚗','💡'];

/* ---------- dates ---------- */
const sod = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
function sow(d){ const x = sod(d); const diff = (x.getDay() - state.settings.weekStart + 7) % 7; return addDays(x, -diff); }
function range(freq, d = new Date()){
  if (freq === 'weekly'){ const a = sow(d); return [a.getTime(), addDays(a,7).getTime()]; }
  if (freq === 'monthly'){ return [new Date(d.getFullYear(), d.getMonth(), 1).getTime(), new Date(d.getFullYear(), d.getMonth()+1, 1).getTime()]; }
  const a = sod(d); return [a.getTime(), addDays(a,1).getTime()];
}
function seasonOf(d){ const m = d.getMonth(); return m===11||m<2 ? 'winter' : m<5 ? 'spring' : m<8 ? 'summer' : 'fall'; }
function seasonStart(d){
  const y = d.getFullYear(), m = d.getMonth();
  if (m === 11) return new Date(y,11,1);
  if (m < 2) return new Date(y-1,11,1);
  return new Date(y, m<5 ? 2 : m<8 ? 5 : 8, 1);
}
const dateKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtDay = t => new Date(t).toLocaleDateString(undefined, {weekday:'short'});
const fmtDate = t => new Date(t).toLocaleDateString(undefined, {month:'short', day:'numeric'});
function daysAgo(t){ return Math.round((sod(new Date()) - sod(t)) / DAY); }
function agoText(t){
  const n = daysAgo(t);
  if (n <= 0) return 'Done today';
  if (n === 1) return 'Yesterday';
  if (n < 14) return `${n} days ago`;
  if (n < 60) return `${Math.round(n/7)} weeks ago`;
  if (n < 365) return `${Math.round(n/30.4)} months ago`;
  const y = n/365; return y < 1.5 ? 'About a year ago' : `${Math.round(y)} years ago`;
}

/* ---------- state ---------- */
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
function seed(){
  const t = sod(new Date()).getTime();
  const mk = (name, emoji, freq, target=1, subs=[]) => ({id:uid(), name, emoji, freq, target, created:t, archived:null, subtasks:subs.map(n => ({id:uid(), name:n}))});
  return {
    version:1,
    chores:[
      mk('Make the bed','🛏️','daily'), mk('Dishes','🍽️','daily'), mk('10-minute tidy','✨','daily'),
      mk('Laundry','🧺','weekly'), mk('Vacuum','🧹','weekly'), mk('Water the plants','🪴','weekly',2), mk('Take out the trash','🗑️','weekly'),
      mk('Clean out the fridge','🧊','monthly',1,['Toss old food','Wipe the shelves','Wipe the drawers']), mk('Dust the shelves','🧽','monthly'),
      mk('Litter box','🐾','loose'), mk('Spring cleaning','🌸','loose',1,['Wash the windows','Wipe the baseboards','Sort the closets','Clean under the furniture']), mk('Clean the oven','🍳','loose'), mk('Wash the windows','🪟','loose'),
    ],
    log:[],
    subChecks:{},
    settings:{season:'auto', weekStart:1, view:'cozy'},
    seeded:true,
  };
}
function normalize(s){
  if (!s || !Array.isArray(s.chores) || !Array.isArray(s.log)) return null;
  s.settings = Object.assign({season:'auto', weekStart:1, view:'cozy'}, s.settings || {});
  s.chores.forEach(c => { c.target = Math.max(1, c.target|0 || 1); if (!FREQS.includes(c.freq)) c.freq = 'daily'; if (!Array.isArray(c.subtasks)) c.subtasks = []; });
  if (!s.subChecks || typeof s.subChecks !== 'object') s.subChecks = {};

}

  const [a,b] = range('daily', day);

  for (const c of state.chores){

/* ---------- subtasks ----------
   Subtask checks belong to one "round" of a chore: the current day/week/month (and which
   repeat within it), or for now-and-then chores, everything since it was last done. */
function roundKey(c){
  if (c.freq === 'loose') return 'L' + (lastDone(c) || 0);
  return range(c.freq)[0] + '#' + countNow(c);
}
function isFull(c){
  if (c.freq === 'loose'){ const t = lastDone(c); return t !== null && daysAgo(t) <= 0; }
  return countNow(c) >= c.target;
}
function subDone(c){
  if (isFull(c)) return c.subtasks.map(x => x.id);
  const m = state.subChecks[c.id];
  return m && m.round === roundKey(c) ? m.done.filter(id => c.subtasks.some(x => x.id === id)) : [];
}
function toggleSub(id, sid){
  const c = find(id); if (!c) return;
  if (isFull(c)){
    // Unchecking a step of a finished chore reopens it with the other steps still checked.
    const es = entries(c, range(c.freq === 'loose' ? 'daily' : c.freq));
    const last = es.reduce((a,b) => b.t > a.t ? b : a);
    state.log = state.log.filter(x => x.id !== last.id);
    state.subChecks[c.id] = {round: roundKey(c), done: c.subtasks.map(x => x.id).filter(x => x !== sid)};
    save(); render(); toast(`Reopened ${c.name}`);
    return;
  }
  const done = subDone(c), i = done.indexOf(sid);
  if (i >= 0) done.splice(i, 1); else done.push(sid);
  const round = roundKey(c);
  if (c.subtasks.every(x => done.includes(x.id))){
    delete state.subChecks[c.id];
    const prev = done.filter(x => x !== sid);
    addEntry(c, Date.now(), PTS[c.freq], () => { state.subChecks[c.id] = {round, done: prev}; save(); render(); });
  } else {
    state.subChecks[c.id] = {round, done};
    save(); render();
  }
}
const expanded = new Set();

/* ---------- rendering ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const CHEV = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`;
const DOTS = `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>`;

function rowHTML(c){
  let cls = '', sub = '';
  if (c.freq === 'loose'){
    const t = lastDone(c);
    const today = t !== null && daysAgo(t) <= 0;
    if (today) cls = 'done';
    sub = t === null ? 'Not logged yet' : today ? '<span class="age-fresh">Done today</span>' : `Last done ${agoText(t).toLowerCase()} · ${fmtDate(t)}`;
    if (t !== null && daysAgo(t) === 1) sub = `Last done yesterday`;
  } else {
    const es = entries(c, range(c.freq)), n = es.length;
    if (n >= c.target) cls = 'done'; else if (n > 0) cls = 'partial';
    if (c.target > 1){
      sub = `<span class="pips">${Array.from({length:c.target},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</span> ${Math.min(n,c.target)} of ${c.target} ${PERIOD_WORD[c.freq]}`;
    } else if (n){
      const t = es[es.length-1].t;
      sub = c.freq === 'daily' ? 'Done' : c.freq === 'weekly' ? `Done ${fmtDay(t)}` : `Done ${fmtDate(t)}`;
    } else {
      sub = c.subtasks.length ? '' : `+${PTS[c.freq]} cozy points`;
    }
  }
  const subs = c.subtasks, open = subs.length && expanded.has(c.id);
  if (subs.length && cls !== 'done'){
    const d = subDone(c).length;
    sub += `${sub ? ' · ' : ''}<span class="subbar"><i style="width:${d/subs.length*100}%"></i></span> ${d} of ${subs.length} subtasks`;
  }
  const doneIds = subs.length ? subDone(c) : [];
  return `<li class="row ${cls}${open ? ' open' : ''}" data-id="${c.id}">
    <button class="check" data-check="${c.id}" aria-label="${cls === 'done' ? 'Uncheck' : 'Mark done:'} ${esc(c.name)}">${CHECK}</button>
    <div class="info"><div class="name">${c.emoji ? `<span class="em">${esc(c.emoji)}</span>` : ''}${esc(c.name)}</div><div class="sub">${sub}</div></div>
    ${subs.length ? CHEV : ''}
    <button class="more" data-edit="${c.id}" aria-label="Edit ${esc(c.name)}">${DOTS}</button>
  </li>${open ? `<li class="subs">${subs.map(x => `<button class="sub-item${doneIds.includes(x.id) ? ' on' : ''}" data-sub="${c.id}" data-sid="${x.id}"><span class="mini">${CHECK}</span><span class="sname">${esc(x.name)}</span></button>`).join('')}</li>` : ''}`;
}

function renderLists(){
  const all = active();
  if (!all.length){
    document.getElementById('lists').innerHTML = `<div class="card empty">No chores yet.<br>Tap <b>+</b> to add your first one.</div>`;
    return;
  }
  let html = '';
  for (const f of FREQS){
    let cs = all.filter(c => c.freq === f);
    if (!cs.length) continue;
    let chip = '';
    if (f === 'loose'){
      cs = cs.slice().sort((a,b) => (lastDone(a) ?? -Infinity) - (lastDone(b) ?? -Infinity));
      chip = `<span class="chip">by longest ago</span>`;
    } else {
      const g = groupProgress(f);
      chip = `<span class="chip ${g.done >= g.total ? 'full' : ''}">${Math.round(g.pct*100)}%</span>`;
    }
    html += `<section class="group"><div class="ghead"><h2>${GROUP_TITLE[f]}</h2>${chip}</div><ul class="list card">${cs.map(rowHTML).join('')}</ul></section>`;
  }
  document.getElementById('lists').innerHTML = html;
}

  else {
    const lo = n ? THRESH[n-1] : 0, hi = THRESH[n];
    bar.style.width = `${Math.max(3, (pts-lo)/(hi-lo)*100)}%`;
    next.textContent = `Next: ${ITEMS[viewSeason()][SLOTS[n]][0].toLowerCase()} at ${hi} pts`;
  }
}

function ringSVG(){
  const rs = [['daily',66],['weekly',50],['monthly',34]];
  return `<svg viewBox="0 0 160 160" aria-hidden="true">${rs.map(([f,r],i)=>{
    const C = 2*Math.PI*r, p = groupProgress(f).pct || 0;
    return `<circle class="ring-bg" cx="80" cy="80" r="${r}" fill="none" stroke="var(--r${i+1})" stroke-width="13"/><circle class="ring-fg" data-c="${C}" data-p="${p}" cx="80" cy="80" r="${r}" fill="none" stroke="var(--r${i+1})" stroke-width="13" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 80 80)" ${p===0?'opacity="0"':''}/>`;
  }).join('')}</svg>`;
}
function renderStats(){
  const el = document.getElementById('stats');
  const legend = [['daily','Today'],['weekly','This week'],['monthly','This month']].map(([f,l],i)=>{
    const g = groupProgress(f);
    return `<div><span class="dot" style="background:var(--r${i+1})"></span><span>${l}<small>${g.total ? `${g.done} of ${g.total}` : 'none set'}</small></span><b>${g.pct===null?'—':Math.round(g.pct*100)+'%'}</b></div>`;
  }).join('');
  const today = sod(new Date());
  const days = Array.from({length:14}, (_,i) => addDays(today, i-13));
  const bars = days.map((d,i) => { const p = dayPct(d); return `<div class="${i===13?'today':''}" title="${fmtDate(d)}: ${p===null?'no chores':Math.round(p*100)+'%'}"><i style="height:${p===null?0:Math.max(4,p*100)}%"></i></div>`; }).join('');
  let perfect = 0; for (let i = 0; i < 30; i++) if (dayPct(addDays(today,-i)) === 1) perfect++;
  const [wa,wb] = range('weekly'); const weekDone = state.log.filter(e => e.t >= wa && e.t < wb).length;
  el.innerHTML = `<div class="rings">${ringSVG()}<div class="legend">${legend}</div></div>
    <div class="tiles"><div class="tile"><b>${seasonPoints()}</b><span>points this ${SEASONS[seasonOf(new Date())].name.toLowerCase()}</span></div><div class="tile"><b>${weekDone}</b><span>chores done this week</span></div><div class="tile"><b>${perfect}</b><span>perfect days, last 30</span></div></div>
    <div class="hist"><h3>Daily chores, last 14 days</h3><div class="bars">${bars}</div><div class="lbl"><span>${fmtDate(days[0])}</span><span>Today</span></div></div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => el.querySelectorAll('.ring-fg').forEach(c => c.setAttribute('stroke-dashoffset', c.dataset.c * (1 - c.dataset.p)))));
}

function renderView(){
  const v = state.settings.view;
  document.getElementById('cozyView').hidden = v !== 'cozy';
  document.getElementById('stats').hidden = v !== 'stats';
  document.getElementById('vCozy').setAttribute('aria-pressed', v === 'cozy');
  document.getElementById('vStats').setAttribute('aria-pressed', v === 'stats');
}

function render(){
  renderHeader(); renderView();
  updateScene(); renderCozyFoot();
  if (state.settings.view === 'stats') renderStats();
  renderLists();
}

/* ---------- actions ---------- */
let toastTimer;
function toast(msg, undo){
  const t = document.getElementById('toast'), u = document.getElementById('toastUndo');
  document.getElementById('toastMsg').textContent = msg;
  u.hidden = !undo; u.onclick = () => { undo(); t.classList.remove('show'); };
  t.classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), undo ? 4500 : 3000);
}
function addEntry(c, t = Date.now(), pts = PTS[c.freq], afterUndo){
  const before = unlockedCount(), dBefore = groupProgress('daily');
  const e = {id:uid(), choreId:c.id, t, pts};
  state.log.push(e); save(); render();
  const after = unlockedCount(), dAfter = groupProgress('daily');
  const undo = () => { removeEntry(e); if (afterUndo) afterUndo(); };
  if (after > before){
    const sn = viewSeason();
    toast(`New for your porch: ${ITEMS[sn][SLOTS[after-1]][0].toLowerCase()}!`, undo);
    if (state.settings.view !== 'cozy'){ state.settings.view = 'cozy'; save(); render(); }
  } else if (c.freq === 'daily' && dAfter.total && dAfter.done >= dAfter.total && dBefore.done < dBefore.total){
    toast('All of today’s chores done. Enjoy your cozy evening.', undo);
  } else toast(`${c.name} done · +${pts} pts`, undo);
  if (navigator.vibrate) try { navigator.vibrate(12); } catch(e){}
  return e;
}
function removeEntry(e){ state.log = state.log.filter(x => x.id !== e.id); save(); render(); }
function tapChore(id){
  const c = find(id); if (!c) return;
  const es = entries(c, range(c.freq === 'loose' ? 'daily' : c.freq));
  const full = c.freq === 'loose' ? es.length > 0 : es.length >= c.target;
  if (full){
    const last = es.reduce((a,b) => b.t > a.t ? b : a);
    delete state.subChecks[c.id];
    removeEntry(last);
    toast(`Unchecked ${c.name}`, () => { state.log.push(last); save(); render(); });
  } else addEntry(c);
}

/* ---------- sheets ---------- */
const wrap = document.getElementById('sheetWrap'), sheet = document.getElementById('sheet');
function openSheet(html){ sheet.innerHTML = `<div class="grip"></div>${html}`; wrap.hidden = false; }
function closeSheet(){ wrap.hidden = true; sheet.innerHTML = ''; }
document.getElementById('backdrop').onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !wrap.hidden) closeSheet(); });

function editChore(id){
  const c = id ? find(id) : null;
  const f = {name: c ? c.name : '', emoji: c ? c.emoji : '', freq: c ? c.freq : 'daily', target: c ? c.target : 1, subs: c ? c.subtasks.map(x => ({...x})) : []};
  const ld = c ? lastDone(c) : null;
  openSheet(`<h2>${c ? 'Edit chore' : 'New chore'}</h2>
    <div class="field"><label for="fName">Chore</label><input type="text" id="fName" maxlength="60" placeholder="e.g. Wipe the counters" value="${esc(f.name)}" autocomplete="off"></div>
    <div class="field"><div class="lbl">Subtasks <span style="font-weight:500">(optional)</span></div><div id="fSubs"></div><button type="button" class="btn ghost" id="fAddSub">+ Add a subtask</button><div class="hint">Check them off one at a time. When they're all done, the chore is done.</div></div>
    <div class="field"><div class="lbl">How often</div><div class="seg" id="fFreq">${FREQS.map(x=>`<button type="button" data-v="${x}" aria-pressed="${x===f.freq}">${FREQ_LABEL[x]}</button>`).join('')}</div>
      <div class="hint" id="fFreqHint"></div></div>
    <div class="field" id="fTargetWrap"><div class="lbl" id="fTargetLbl">Times</div><div class="stepper"><button type="button" id="tMinus" aria-label="Fewer">−</button><output id="fTarget">${f.target}</output><button type="button" id="tPlus" aria-label="More">+</button></div></div>
    <div class="field" id="fLastWrap"><label for="fLast">Last done</label><input type="date" id="fLast" value="${ld ? dateKey(new Date(ld)) : ''}" max="${dateKey(new Date())}"><div class="hint">Optional. Set this if you remember roughly when you last did it.</div></div>
    <div class="field"><div class="lbl">Icon</div><div class="emojis" id="fEmoji"><button type="button" data-v="" aria-pressed="${!f.emoji}" style="font-size:13px;color:var(--muted)">none</button>${EMOJIS.map(x=>`<button type="button" data-v="${x}" aria-pressed="${x===f.emoji}">${x}</button>`).join('')}</div></div>
    <div class="actions">${c ? `<button class="btn danger" id="fDel">Delete</button>` : ''}<button class="btn" id="fCancel">Cancel</button><button class="btn primary" id="fSave">${c ? 'Save' : 'Add chore'}</button></div>`);
  const $ = s => sheet.querySelector(s);
  const sync = () => {
    $('#fFreq').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === f.freq));
    $('#fTargetWrap').hidden = f.freq === 'loose';
    $('#fLastWrap').hidden = f.freq !== 'loose';
    $('#fTargetLbl').textContent = `Times ${PERIOD_WORD[f.freq] || ''}`;
    $('#fTarget').textContent = f.target;
    $('#fFreqHint').textContent = f.freq === 'loose' ? 'No schedule. The app just keeps track of when you last did it.' : `Worth ${PTS[f.freq]} cozy points each time.`;
  };
  sync();
  const drawSubs = () => {
    $('#fSubs').innerHTML = f.subs.map((x,i) => `<div class="sub-edit"><input type="text" data-i="${i}" value="${esc(x.name)}" placeholder="Subtask ${i+1}" maxlength="60" autocomplete="off"><button type="button" data-del="${i}" aria-label="Remove subtask">×</button></div>`).join('');
  };
  const addSub = () => { f.subs.push({id:uid(), name:''}); drawSubs(); const ins = $('#fSubs').querySelectorAll('input'); ins[ins.length-1].focus(); };
  drawSubs();
  $('#fAddSub').onclick = addSub;
  $('#fSubs').oninput = e => { const i = e.target.dataset.i; if (i !== undefined) f.subs[i].name = e.target.value; };
  $('#fSubs').onkeydown = e => { if (e.key === 'Enter' && e.target.dataset.i !== undefined){ e.preventDefault(); addSub(); } };
  $('#fSubs').onclick = e => { const b = e.target.closest('[data-del]'); if (b){ f.subs.splice(+b.dataset.del, 1); drawSubs(); } };
  $('#fFreq').onclick = e => { const b = e.target.closest('button'); if (b){ f.freq = b.dataset.v; sync(); } };
  $('#tMinus').onclick = () => { f.target = Math.max(1, f.target-1); sync(); };
  $('#tPlus').onclick = () => { f.target = Math.min(14, f.target+1); sync(); };
  $('#fEmoji').onclick = e => { const b = e.target.closest('button'); if (!b) return; f.emoji = b.dataset.v; $('#fEmoji').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); };
  $('#fCancel').onclick = closeSheet;
  $('#fSave').onclick = () => {
    const name = $('#fName').value.trim();
    if (!name){ $('#fName').focus(); $('#fName').style.borderColor = 'var(--accent)'; return; }
    let target = f.freq === 'loose' ? 1 : f.target;
    const subtasks = f.subs.map(x => ({id:x.id, name:x.name.trim()})).filter(x => x.name);
    let ch = c;
    if (ch){ Object.assign(ch, {name, emoji:f.emoji, freq:f.freq, target, subtasks}); }
    else { ch = {id:uid(), name, emoji:f.emoji, freq:f.freq, target, created:Date.now(), archived:null, subtasks}; state.chores.push(ch); }
    if (subtasks.length) expanded.add(ch.id);
    const lv = $('#fLast').value;
    if (f.freq === 'loose' && lv && lv !== (ld ? dateKey(new Date(ld)) : '')){
      const [y,m,d] = lv.split('-').map(Number);
      const t = new Date(y, m-1, d, 12).getTime();
      if (!ld || t > ld) state.log.push({id:uid(), choreId:ch.id, t: Math.min(t, Date.now()), pts:0, backfill:true});
      else { state.log = state.log.filter(e => !(e.choreId === ch.id && e.backfill && e.t > t)); state.log.push({id:uid(), choreId:ch.id, t, pts:0, backfill:true}); }
    }
    save(); closeSheet(); render(); toast(c ? 'Saved' : `Added ${name}`);
  };
  if (c) $('#fDel').onclick = () => {
    c.archived = Date.now(); save(); closeSheet(); render();
    toast(`Deleted ${c.name}`, () => { c.archived = null; save(); render(); });
  };
  if (!c) setTimeout(() => $('#fName') && $('#fName').focus(), 250);
}

function openSettings(){
  const s = state.settings, auto = SEASONS[seasonOf(new Date())].name;
  openSheet(`<h2>Settings</h2>
    <div class="field"><div class="lbl">Season look</div><div class="seg" id="sSeason">${[['auto',`Automatic (${auto})`],['winter','Winter'],['spring','Spring'],['summer','Summer'],['fall','Fall']].map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${s.season===v}">${l}</button>`).join('')}</div>
      <div class="hint">Automatic changes on Dec 1, Mar 1, Jun 1 and Sep 1. Each season starts a fresh porch to decorate. Points always count toward the real season.</div></div>
    <div class="field"><div class="lbl">Week starts on</div><div class="seg" id="sWeek"><button type="button" data-v="0" aria-pressed="${s.weekStart===0}">Sunday</button><button type="button" data-v="1" aria-pressed="${s.weekStart===1}">Monday</button></div></div>
    <div class="field"><div class="lbl">Backup</div><div class="set-row">
      <button class="btn" id="sExport">Save a backup file</button>
      <button class="btn" id="sImport">Restore from a backup file</button>
      <input type="file" id="sFile" accept="application/json,.json" hidden>
    </div><div class="hint">Your chores live only on this phone. Save a backup now and then (to Google Drive or Files) so they're safe.</div></div>
    <div class="set-row"><button class="btn danger" id="sReset" style="text-align:left">Erase everything and start over</button></div>
    <div class="actions"><button class="btn primary" id="sDone">Done</button></div>`);
  const $ = q => sheet.querySelector(q);
  $('#sSeason').onclick = e => { const b = e.target.closest('button'); if (!b) return; s.season = b.dataset.v; save(); render(); $('#sSeason').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); };
  $('#sWeek').onclick = e => { const b = e.target.closest('button'); if (!b) return; s.weekStart = +b.dataset.v; save(); render(); $('#sWeek').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); };
  $('#sExport').onclick = exportBackup;
  $('#sImport').onclick = () => $('#sFile').click();
  $('#sFile').onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const s2 = normalize(JSON.parse(await file.text()));
      if (!s2) throw new Error('bad');
      if (!confirm(`Replace everything with this backup (${s2.chores.filter(c=>!c.archived).length} chores)?`)) return;
      state = s2; save(); closeSheet(); buildScene(); render(); toast('Backup restored');
    } catch(err){ toast("That file doesn't look like a Cozy Chores backup"); }
  };
  $('#sReset').onclick = () => {
    if (!confirm('Erase all chores and history? This can’t be undone (unless you saved a backup).')) return;
    state = seed(); state.chores = []; save(); closeSheet(); buildScene(); render(); toast('Fresh start');
  };
  $('#sDone').onclick = closeSheet;
}
async function exportBackup(){
  const name = `cozy-chores-backup-${dateKey(new Date())}.json`;
  const blob = new Blob([JSON.stringify(state)], {type:'application/json'});
  try {
    const file = new File([blob], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Cozy Chores backup'}); return; }
  } catch(e){ if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- wiring ---------- */
document.getElementById('lists').addEventListener('click', e => {
  const ed = e.target.closest('[data-edit]'); if (ed){ editChore(ed.dataset.edit); return; }
  const sb = e.target.closest('[data-sub]'); if (sb){ toggleSub(sb.dataset.sub, sb.dataset.sid); return; }
  const ck = e.target.closest('[data-check]'); if (ck){ tapChore(ck.dataset.check); return; }
  const row = e.target.closest('.row'); if (!row) return;
  const c = find(row.dataset.id);
  // Chores with subtasks open their checklist; others check off with a tap anywhere.
  if (c && c.subtasks.length){ expanded.has(c.id) ? expanded.delete(c.id) : expanded.add(c.id); renderLists(); }
  else tapChore(row.dataset.id);
});
document.getElementById('addBtn').onclick = () => editChore(null);
document.getElementById('settingsBtn').onclick = openSettings;
document.getElementById('vCozy').onclick = () => { state.settings.view = 'cozy'; save(); render(); };
document.getElementById('vStats').onclick = () => { state.settings.view = 'stats'; save(); render(); };

let lastDay = dateKey(new Date()), lastHour = new Date().getHours();
function tick(){ const now = new Date(); if (dateKey(now) !== lastDay || now.getHours() !== lastHour){ lastDay = dateKey(now); lastHour = now.getHours(); render(); } }
setInterval(tick, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

buildScene(); render();
if (state.seeded){ delete state.seeded; save(); setTimeout(() => toast('Starter chores added. Tap ⋯ on any chore to edit or delete it.'), 600); }
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
